server {
    listen 80;
    listen [::]:80;
    server_name imagelab.site www.imagelab.site;
    return 301 https://imagelab.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.imagelab.site;

    ssl_certificate /etc/letsencrypt/live/imagelab.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imagelab.site/privkey.pem;

    return 301 https://imagelab.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name imagelab.site;

    ssl_certificate /etc/letsencrypt/live/imagelab.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imagelab.site/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
