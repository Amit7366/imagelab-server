name: imagelab

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - imagelab_mongo:/data/db
    networks:
      - imagelab
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: ghcr.io/amit7366/imagelab-server:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:5900:5000"
    volumes:
      - imagelab_storage:/app/storage
    networks:
      - imagelab

  web:
    image: ghcr.io/amit7366/imagelab-client:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3900:3000"
    networks:
      - imagelab

volumes:
  imagelab_mongo:
  imagelab_storage:

networks:
  imagelab:
